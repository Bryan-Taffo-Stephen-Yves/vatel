[build]
  command = "npm run build"
  publish = ".next"

# Module Next.js de Netlify : fait tourner l'appli (pages, middleware). Sans lui, le site répond « Page introuvable ».
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Le service worker ne doit jamais être mis en cache par le CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Photos des plats : mises en cache 7 jours par le navigateur et le CDN, rafraîchies en arrière-plan ensuite
[[headers]]
  for = "/dishes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Modèle de détection de la caméra d'affluence (14 Mo) : gardé 30 jours par le téléphone, chargé une seule fois
[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# En-têtes de sécurité sur toutes les pages : pas d'affichage dans un cadre d'un autre site (anti-clickjacking),
# pas de devinette de type de fichier, adresse de la page non transmise aux autres sites, caméra/micro/position
# réservés à l'appli elle-même (scanner, caméra d'affluence, suivi du coursier).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
